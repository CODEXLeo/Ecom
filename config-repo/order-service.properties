# ============================================================
# APPLICATION
# ============================================================

spring.application.name=order-service


# ============================================================
# HTTPS
# ============================================================

server.ssl.enabled=true
server.ssl.key-store=file:${TLS_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-alias=1


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${ORDER_DB_URL}
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# JWT
# ============================================================

security.jwt.issuer=${JWT_ISSUER}
security.jwt.public-key-path=${ORDER_JWT_PUBLIC_KEY_PATH}


# ============================================================
# OUTBOUND SERVICE mTLS
# ============================================================

service.mtls.client-key-store-path=${TLS_CLIENT_KEYSTORE_PATH}
service.mtls.client-key-store-password=${TLS_CLIENT_KEYSTORE_PASSWORD}

service.mtls.trust-store-path=${TLS_TRUSTSTORE_PATH}
service.mtls.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}


# ============================================================
# ORDER LIMITS
# ============================================================

order.max-items-per-order=50
order.max-quantity-per-item=100
order.idempotency-key-max-length=128


# ============================================================
# IDEMPOTENCY
# ============================================================

idempotency.record-ttl=15m
