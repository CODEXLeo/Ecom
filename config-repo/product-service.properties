# ============================================================
# APPLICATION
# ============================================================

spring.application.name=product-service


# ============================================================
# HTTPS / TLS
# ============================================================

server.ssl.enabled=true
server.ssl.key-store=file:${TLS_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-alias=1


# ============================================================
# INTERNAL SERVICE mTLS
# ============================================================

server.ssl.client-auth=want
server.ssl.enabled-protocols=TLSv1.2
server.ssl.trust-store=file:${TLS_TRUSTSTORE_PATH}
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${PRODUCT_DB_URL}
spring.datasource.username=${PRODUCT_DB_USERNAME}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

spring.jpa.show-sql=true


# ============================================================
# JWT RESOURCE SERVER
# ============================================================

security.jwt.issuer=user-service
security.jwt.public-key-path=${PRODUCT_JWT_PUBLIC_KEY_PATH}


# ============================================================
# INVENTORY RESERVATION
# ============================================================

inventory.reservation.duration=PT10M
inventory.reservation.expiry-check-delay-ms=60000
