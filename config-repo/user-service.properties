# ============================================================
# APPLICATION
# ============================================================

spring.application.name=user-service


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false


# ============================================================
# JWT
# ============================================================

security.jwt.issuer=user-service
security.jwt.access-token-expiration=PT10M

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}


# ============================================================
# AUTHENTICATION COOKIES
# ============================================================

security.cookie.access-token-name=__Host-access_token
security.cookie.refresh-token-name=__Host-refresh_token

security.cookie.refresh-token-expiration=P30D

security.cookie.secure=true
security.cookie.same-site=Lax


# ============================================================
# CSRF / SWAGGER
# ============================================================

springdoc.swagger-ui.csrf.enabled=true


# ============================================================
# AUTHENTICATION PROTECTION
# ============================================================

security.authentication.maximum-failed-login-attempts=5
security.authentication.account-lock-duration=PT15M


# ============================================================
# INITIAL ADMINISTRATOR BOOTSTRAP
# ============================================================

security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

security.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
security.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}


# ============================================================
# HTTPS
# ============================================================

server.ssl.enabled=true
server.ssl.key-store=file:${TLS_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-alias=1


# ============================================================
# LOGGING
# ============================================================

logging.level.org.springframework.security=INFO
